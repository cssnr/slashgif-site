version: '3.9'

services:
  nginx:
    build:
      context: ./nginx
      network: host
    image: registry.hosted-domains.com/shane/slashgif-site-nginx:${VERSION}
    env_file: ${ENV_FILE}
    deploy:
      mode: global
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=traefik-public"
        - "traefik.constraint-label=traefik-public"
        - "traefik.http.routers.STACK_NAME-http.rule=Host(${TRAEFIK_HOST})"
        - "traefik.http.routers.STACK_NAME-http.entrypoints=http"
        - "traefik.http.routers.STACK_NAME-http.middlewares=https-redirect"
        - "traefik.http.routers.STACK_NAME-https.rule=Host(${TRAEFIK_HOST})"
        - "traefik.http.routers.STACK_NAME-https.entrypoints=https"
        - "traefik.http.routers.STACK_NAME-https.tls=true"
        - "traefik.http.services.STACK_NAME.loadbalancer.server.port=80"
        - "traefik.http.services.STACK_NAME.loadbalancer.server.scheme=http"
    volumes:
      - data_dir:/data
    depends_on:
      - app
    networks:
      - traefik-public
      - net-internal

  app:
    build: ./app
    image: registry.hosted-domains.com/shane/slashgif-site-app:${VERSION}
    env_file: ${ENV_FILE}
    command: "gunicorn slashgif_site.wsgi:application -w 2 -b 0.0.0.0:9000"
    deploy:
      mode: global
    volumes:
      - data_dir:/data
    networks:
      - net-internal

volumes:
  data_dir:

networks:
  net-internal:
    driver: overlay
  traefik-public:
    external: true
