version: "3.8"

services:
  nginx:
    build: nginx
    image: ghcr.io/cssnr/slashgif-site-nginx:${VERSION:-latest}
    deploy:
      mode: global
      resources:
        limits:
          cpus: "1.0"
          memory: 32M
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=traefik-public"
        - "traefik.constraint-label=traefik-public"
        - "traefik.http.routers.${STACK_NAME}-http.rule=Host(`${TRAEFIK_HOST}`)"
        - "traefik.http.routers.${STACK_NAME}-http.entrypoints=http"
        - "traefik.http.routers.${STACK_NAME}-http.middlewares=${STACK_NAME}-http-redirect"
        - "traefik.http.middlewares.${STACK_NAME}-http-redirect.redirectscheme.scheme=https"
        - "traefik.http.middlewares.${STACK_NAME}-http-redirect.redirectscheme.permanent=true"
        - "traefik.http.routers.${STACK_NAME}-https.rule=Host(`${TRAEFIK_HOST}`)"
        - "traefik.http.routers.${STACK_NAME}-https.entrypoints=https"
        - "traefik.http.routers.${STACK_NAME}-https.tls=true"
        - "traefik.http.services.${STACK_NAME}.loadbalancer.server.port=80"
        - "traefik.http.services.${STACK_NAME}.loadbalancer.server.scheme=http"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1/health-check || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 10s
    volumes:
      - data_dir:/data
    depends_on:
      - app
    networks:
      - traefik-public
      - internal

  app:
    build:
      context: .
      dockerfile: ./app/Dockerfile
    image: ghcr.io/cssnr/slashgif-site-app:${VERSION:-latest}
    environment: &environment
      DJANGO_LOG_LEVEL: ${DJANGO_LOG_LEVEL}
      DJANGO_APP_LOG_LEVEL: ${DJANGO_APP_LOG_LEVEL}
      DJANGO_DEBUG: ${DJANGO_DEBUG}
      DJANGO_ALLOWED: ${DJANGO_ALLOWED}
      DJANGO_SESSION: ${DJANGO_SESSION}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DATA_DIR: ${DJANGO_DATA_DIR}
      DJANGO_STATIC_DIR: ${DJANGO_STATIC_DIR}
      DJANGO_LANGUAGE_CODE: ${DJANGO_LANGUAGE_CODE}
      USE_TZ: ${USE_TZ}
      TZ: ${TZ}
      STATSD_PREFIX: ${STATSD_PREFIX}
      STATSD_PORT: ${STATSD_PORT}
      STATSD_HOST: ${STATSD_HOST}
      SLACK_OAUTH_URL: ${SLACK_OAUTH_URL}
      SLACK_ACCESS_URL: ${SLACK_ACCESS_URL}
      SLACK_CLIENT_ID: ${SLACK_CLIENT_ID}
      SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET}
      SLACK_REDIRECT_URI: ${SLACK_REDIRECT_URI}
      SLACK_OAUTH_SCOPES: ${SLACK_OAUTH_SCOPES}
      SLACK_APP_URL: ${SLACK_APP_URL}
      STATUS_SITE: ${STATUS_SITE}
      DISCORD_HOOK_URL: ${DISCORD_HOOK_URL}
    command: "gunicorn slashgif_site.wsgi:application -b 0.0.0.0:9000 -w 2"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/app-health-check/"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      mode: global
      resources:
        limits:
          cpus: "2.0"
          memory: 200M
    volumes:
      - data_dir:/data
    networks:
      - internal

volumes:
  data_dir:

networks:
  internal:
    driver: overlay
  traefik-public:
    external: true
